name: copiloto
description: "Copiloto: asistente de IA por voz para el auto, con soporte para Android Auto."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  speech_to_text: ^7.5.0
  flutter_tts: ^4.2.5
  geolocator: ^14.1.1
  webview_flutter: ^4.14.1
  webview_flutter_android: any
  url_launcher: ^6.3.3
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
